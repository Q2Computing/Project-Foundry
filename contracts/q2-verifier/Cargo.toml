[package]
name = "q2-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "On-chain conformance verification and a ranked leaderboard for well-specified VLSI blocks on Arbitrum Stylus. The contract itself checks a submitted gate netlist against a golden spec, exhaustively, and keeps the cheapest conformant design."

[dependencies]
stylus-sdk = "0.10.9"
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "q2-verifier"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
