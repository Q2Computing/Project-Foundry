name: EDP assessment (independent oracle)

# Re-measures every committed candidate against the foundry part, from scratch,
# on the open sky130 PDK. This job IS the oracle: the verdict is public and
# re-runnable, not Q2's word. It never generates designs, generation is a
# separate, isolated step, it only judges what was committed. A false or
# tampered "beats the part" claim fails the build (--gate).

on:
  push:
    paths: ["candidates/**", "tools/**", ".github/workflows/assess.yml"]
  pull_request:
    paths: ["candidates/**", "tools/**"]
  workflow_dispatch:

env:
  SKY130_VERSION: 0fe599b2afb6708d281543108caf8310912f54af

jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice --version

      - name: Fetch open sky130 PDK (pinned) via ciel
        run: |
          python -m pip install --upgrade pip
          pip install ciel
          ciel enable --pdk sky130 "$SKY130_VERSION"
          PDK_ROOT="$(find "$HOME/.ciel" "$HOME/.volare" -maxdepth 5 -type d -name sky130A 2>/dev/null | head -1)"
          test -n "$PDK_ROOT" || { echo "sky130A not found after ciel enable"; exit 1; }
          echo "PDK_ROOT=$PDK_ROOT" >> "$GITHUB_ENV"
          echo "resolved PDK_ROOT=$PDK_ROOT"
          test -f "$PDK_ROOT/libs.tech/ngspice/sky130.lib.spice"

      - name: "Assess (gate: a committed winner must still beat the part)"
        run: |
          python tools/assess.py --gate \
            --candidates candidates/manifest.json \
            --out results

      - name: Prepare disclosure-safe provenance records
        if: always()
        run: python tools/anchor.py results/leaderboard.json candidates/manifest.json || true

      - name: Upload assessment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edp-assessment
          path: |
            results/
            provenance/
