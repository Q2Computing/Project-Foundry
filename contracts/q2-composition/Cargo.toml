[package]
name = "q2-composition"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Proof certificates that license into larger proofs on Arbitrum Stylus. A proof of a small VLSI block is a licensable certificate; a larger system is certified by referencing child certificates the chain already holds, without the composer ever accessing the child design. Proof lineage is the royalty graph."

[dependencies]
stylus-sdk = "0.6.0"
# Same coherent 0.7.6 sol-macro toolchain pin as q2-anchor / q2-verifier.
alloy-sol-types = "=0.7.6"
alloy-sol-macro = "=0.7.6"
alloy-sol-macro-expander = "=0.7.6"
alloy-sol-macro-input = "=0.7.6"
syn-solidity = "=0.7.6"
ruint = "~1.12"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "q2-composition"
path = "src/main.rs"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
