<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Design View</title>
<meta name="description" content="Watch the agent explore custom cell designs against a foundry part in 3D, then anchor the winner on Arbitrum Stylus">
<style>
  :root{--bg:#0a0e14;--ink:#e6edf3;--dim:#8b949e;--green:#3fb950;--red:#f85149;
    --amber:#e3b341;--blue:#58a6ff;--line:#22303c;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:fixed;background:rgba(13,17,23,.82);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  #top{top:16px;left:16px;right:150px;display:flex;gap:12px;pointer-events:none}
  #title{font-weight:700;font-size:15px}
  #title small{display:block;color:var(--dim);font-weight:400;font-size:12px;
    margin-top:2px}
  .badge{position:fixed;top:16px;right:16px;font-family:var(--mono);font-size:11px;
    color:var(--amber);border:1px solid #3d2c0a;background:#1c1408;
    border-radius:999px;padding:6px 12px}
  #hud{left:16px;bottom:16px;width:min(340px,calc(100vw - 32px))}
  #hud .name{font-weight:700;font-size:16px;margin-bottom:2px}
  #hud .note{color:var(--dim);font-size:13px;min-height:34px;margin-bottom:12px}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .metric{display:flex;justify-content:space-between;font-size:13px;
    border-bottom:1px solid var(--line);padding-bottom:5px}
  .metric span:first-child{color:var(--dim)}
  .metric .val{font-family:var(--mono);font-variant-numeric:tabular-nums}
  #verdict{margin-top:12px;font-family:var(--mono);font-size:13px;font-weight:600}
  #verdict.win{color:var(--green)} #verdict.lose{color:var(--red)}
  #verdict.tie{color:var(--ink)}
  #anchor{margin-top:10px;font-size:12px;color:var(--amber);display:none;
    line-height:1.5;word-break:break-all}
  #anchor b{color:var(--ink)}
  #ctrl{right:16px;bottom:16px;display:flex;gap:8px;align-items:center}
  button{font-family:var(--sans);font-size:13px;color:var(--ink);
    background:#161b22;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  #legend{position:fixed;right:16px;bottom:64px;font-size:12px;color:var(--dim);
    text-align:right;line-height:1.8}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-left:7px;vertical-align:middle;border:1px solid rgba(255,255,255,.15)}
  a.home{position:fixed;left:16px;top:70px;color:var(--blue);font-size:13px;
    text-decoration:none;pointer-events:auto}
  @media(max-width:620px){#legend{display:none}#top{right:120px}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="top" class="panel">
  <div id="title">Agent designing a driver to beat <b>buf_16</b>
    <small>sky130 largest buffer, 250 fF load. Same transistors, better arrangement</small>
  </div>
</div>
<div class="badge">provenance anchored on Arbitrum Stylus</div>
<a class="home" href="./">back to overview</a>
<div id="legend">
  foundry part<span class="dot" style="background:#e6edf3"></span><br>
  beats the part<span class="dot" style="background:#3fb950"></span><br>
  worse than part<span class="dot" style="background:#f85149"></span>
</div>

<div id="hud" class="panel">
  <div class="name" id="h-name">warming up</div>
  <div class="note" id="h-note"></div>
  <div class="metrics">
    <div class="metric"><span>delay</span><span class="val" id="h-tpd">-</span></div>
    <div class="metric"><span>energy</span><span class="val" id="h-e">-</span></div>
    <div class="metric"><span>EDP</span><span class="val" id="h-edp">-</span></div>
    <div class="metric"><span>area</span><span class="val" id="h-area">-</span></div>
  </div>
  <div id="verdict"></div>
  <div id="anchor"></div>
</div>

<div id="ctrl">
  <button id="prev">prev</button>
  <button id="play">pause</button>
  <button id="next">next</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- real measured data (results/leaderboard.json + report.md) ---------------
const PART = {stages:[6,16], tpd:0.1457, E:1007.8, area:36.3, edp:146.86};
const DESIGNS = [
 {name:"under-drive [4,10]", stages:[4,10], tpd:0.1878, E:935.9, area:23.1, edp:175.75, gain:-19.7,
  note:"too weak: slower than the part, EDP worse"},
 {name:"4-stage [1,4,11,32]", stages:[1,4,11,32], tpd:0.2351, E:1306.8, area:79.2, edp:307.27, gain:-109.2,
  note:"over-segmented: four stage delays stack up"},
 {name:"equivalent [6,16]", stages:[6,16], tpd:0.1457, E:1007.8, area:36.3, edp:146.86, gain:0.0,
  note:"reproduces buf_16 to 5 figures, a same-ruler check"},
 {name:"drive-24 [8,24]", stages:[8,24], tpd:0.1254, E:1098.7, area:52.8, edp:137.78, gain:6.2,
  note:"past the ladder cap of 16, the first real win"},
 {name:"drive-40 [13,40]", stages:[13,40], tpd:0.1053, E:1278.6, area:87.5, edp:134.64, gain:8.3,
  note:"more drive, faster, but energy climbs"},
 {name:"drive-48 [16,48]", stages:[16,48], tpd:0.0986, E:1368.0, area:105.6, edp:134.95, gain:8.1,
  note:"fastest of all, yet hungry and large"},
 {name:"drive-32 f3 [11,32]", stages:[11,32], tpd:0.1109, E:1191.0, area:70.9, edp:132.13, gain:10.0,
  note:"balanced, closing in on the best"},
 {name:"drive-32 f2.5 [13,32]", stages:[13,32], tpd:0.1043, E:1199.4, area:74.2, edp:125.10, gain:14.8,
  note:"best EDP: a bigger input stage sharpens the output",
  best:true, anchor:"0xbbe5a7f195b272f026f74a60c2884d73334cdf7029edc32cddcf90f510cf8f7c",
  label:1482, context:16},
];
const C_WIN=0x3fb950, C_LOSE=0xf85149, C_PART=0xe6edf3;
function verdictColor(g){ if(g>0.05)return C_WIN; if(g<-0.05)return C_LOSE; return C_PART; }

// ---- three.js scene ----------------------------------------------------------
const host = document.getElementById("stage");
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e14, 28, 66);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, .6));
const key = new THREE.DirectionalLight(0xffffff, .9); key.position.set(8,14,10); scene.add(key);
const rim = new THREE.DirectionalLight(0x58a6ff, .45); rim.position.set(-10,5,-8); scene.add(rim);
const grid = new THREE.GridHelper(70, 70, 0x22303c, 0x141a22);
grid.position.y = -3.2; scene.add(grid);

const UNIT = new THREE.BoxGeometry(0.72, 0.72, 0.72);
const cell = new THREE.Group(); scene.add(cell);
const partGroup = new THREE.Group(); scene.add(partGroup);

function mat(color, emissive, op){
  return new THREE.MeshStandardMaterial({color, emissive:emissive,
    emissiveIntensity:.4, metalness:.25, roughness:.5,
    transparent:op!==undefined, opacity:op===undefined?1:op});
}
function shade(hex,f){return new THREE.Color(hex).multiplyScalar(f).getHex();}

function buildStack(m, color, emissive, op){
  const g = new THREE.Group();
  const cols = Math.ceil(Math.sqrt(m)), rows = Math.ceil(m/cols), s = 0.82;
  for(let i=0;i<m;i++){
    const c=i%cols, r=Math.floor(i/cols);
    const b = new THREE.Mesh(UNIT, mat(color, emissive, op));
    b.position.set(0,(r-(rows-1)/2)*s,(c-(cols-1)/2)*s);
    b.userData.t=0; b.scale.setScalar(op===undefined?0.01:1);
    g.add(b);
  }
  return g;
}
// chain of stages along +x; color is the verdict color, brightening toward output
function buildDesign(stages, color, op){
  const g = new THREE.Group(); const gap=4.2, n=stages.length;
  stages.forEach((m,i)=>{
    const t = n>1? i/(n-1):1;
    const col = shade(color, 0.55+0.45*t);
    const emis = shade(color, 0.18+0.22*t);
    const stack = buildStack(m, col, emis, op);
    stack.position.x = (i-(n-1)/2)*gap; g.add(stack);
    if(i<n-1){
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3((i-(n-1)/2)*gap+0.5,0,0),
        new THREE.Vector3((i+1-(n-1)/2)*gap-0.5,0,0)]);
      g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x30363d,
        transparent:op!==undefined, opacity:op===undefined?1:op})));
    }
  });
  // the 250 fF load the driver must swing
  const load = new THREE.Mesh(new THREE.SphereGeometry(0.9,24,24),
    mat(color, shade(color,0.25), op===undefined?.9:op));
  load.position.x=((n-1)/2)*gap+2.6; load.userData.load=true; g.add(load);
  const wire = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(((n-1)/2)*gap+0.5,0,0),
    new THREE.Vector3(load.position.x-0.9,0,0)]);
  g.add(new THREE.Line(wire, new THREE.LineBasicMaterial({color:0x30363d})));
  return g;
}

// white ghost of the foundry part, floating behind for reference (neutral)
(function(){
  const ghost = buildDesign(PART.stages, C_PART, 0.14);
  ghost.position.set(0, 8.5, -2); ghost.scale.setScalar(0.62);
  partGroup.add(ghost);
})();

let current=null, idx=0, playing=true, tAcc=0, born=0;
function setMetric(id, text, cand, part){
  const el = document.getElementById(id);
  el.textContent = text;
  const d = cand - part;
  el.style.color = Math.abs(d) < 1e-9 ? 'var(--ink)'
                  : (d < 0 ? 'var(--green)' : 'var(--red)');   // lower is better
}
function show(i){
  idx=(i+DESIGNS.length)%DESIGNS.length; const d=DESIGNS[idx];
  if(current) cell.remove(current);
  current = buildDesign(d.stages, verdictColor(d.gain)); cell.add(current);
  born=performance.now();
  document.getElementById("h-name").textContent=d.name;
  document.getElementById("h-note").textContent=d.note;
  setMetric("h-tpd", d.tpd.toFixed(4)+" ns", d.tpd, PART.tpd);
  setMetric("h-e",   d.E.toFixed(0)+" fJ",   d.E,   PART.E);
  setMetric("h-edp", d.edp.toFixed(1),        d.edp, PART.edp);
  setMetric("h-area",d.area.toFixed(1)+" um", d.area,PART.area);
  const v=document.getElementById("verdict"), an=document.getElementById("anchor");
  if(Math.abs(d.gain)<0.05){v.className="tie";v.textContent="ties the part (validator)";}
  else if(d.gain>0){v.className="win";v.textContent="beats buf_16 by "+d.gain.toFixed(1)+"% EDP";}
  else{v.className="lose";v.textContent=d.gain.toFixed(1)+"% EDP: the part wins";}
  if(d.best){an.style.display="block";
    an.innerHTML='<b>anchored on Arbitrum Stylus</b><br>record(hash, '+d.label+', '+d.context+')<br>'+d.anchor.slice(0,26)+"...";}
  else an.style.display="none";
}
show(0);

// hand-rolled orbit
let az=0.7, el=0.42, rad=32, tgt=new THREE.Vector3(0,2,0), drag=false, px=0, py=0;
function place(){camera.position.set(
  tgt.x+rad*Math.cos(el)*Math.sin(az), tgt.y+rad*Math.sin(el),
  tgt.z+rad*Math.cos(el)*Math.cos(az)); camera.lookAt(tgt);}
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{if(!drag)return;
  az-=(e.clientX-px)*0.006; el=Math.max(-0.15,Math.min(1.3,el+(e.clientY-py)*0.006));
  px=e.clientX;py=e.clientY;});
renderer.domElement.addEventListener("wheel",e=>{e.preventDefault();
  rad=Math.max(16,Math.min(56,rad+e.deltaY*0.02));},{passive:false});
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById("next").onclick=()=>{show(idx+1);tAcc=0;};
document.getElementById("prev").onclick=()=>{show(idx-1);tAcc=0;};
document.getElementById("play").onclick=e=>{playing=!playing;e.target.textContent=playing?"pause":"play";};

const clock=new THREE.Clock();
function tick(){
  const dt=clock.getDelta();
  if(!drag) az+=dt*0.12;
  current && current.traverse(o=>{ if(o.geometry && o.geometry.type==="BoxGeometry" && o.userData.t!==undefined){
    o.userData.t=Math.min(1,o.userData.t+dt*2.4); const s=o.userData.t; o.scale.setScalar(s*(2-s));}});
  partGroup.rotation.y += dt*0.12;
  current && current.traverse(o=>{ if(o.userData.load){
    o.scale.setScalar(1+Math.sin(performance.now()*0.004)*0.06);}});
  tAcc+=dt; const hold=DESIGNS[idx].best?5.5:3.0;
  if(playing && tAcc>hold){tAcc=0; show(idx+1);}
  place(); renderer.render(scene,camera); requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
